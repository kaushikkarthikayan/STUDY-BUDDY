{% extends "base.html" %}
{% block title %}College Notices{% endblock %}
{% block content %}
<h2 class="mb-3"><i class="bi bi-megaphone"></i> College Notices</h2>
<div class="row g-4">
  <div class="col-lg-8">
    {% for n in notices %}
    <div class="card mb-3"><div class="card-body">
      <div class="d-flex justify-content-between"><h5 class="mb-1">{{ n.title }}</h5><span class="badge bg-info text-dark align-self-start">{{ n.category }}</span></div>
      <p class="mb-1">{{ n.body }}</p>
      <small class="text-muted">{{ n.posted_by }} · {{ n.created_at[:10] }}</small>
    </div></div>
    {% endfor %}
  </div>
  <div class="col-lg-4">
    <form method="post" class="card card-body">
      <h5>Post a notice <small class="text-muted fs-6">(teachers)</small></h5>
      <input name="title" class="form-control mb-2" placeholder="Title" required>
      <textarea name="body" class="form-control mb-2" rows="4" placeholder="Details" required></textarea>
      <select name="category" class="form-select mb-2">{% for c in ['General','Exam','Assignment','Event'] %}<option>{{ c }}</option>{% endfor %}</select>
      <input name="posted_by" class="form-control mb-3" placeholder="Your name">
      <button class="btn btn-primary">Post notice</button>
    </form>
  </div>
</div>
{% endblock %}
